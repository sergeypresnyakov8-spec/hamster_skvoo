<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Звёздный Король — Космическая Империя</title>
    <meta name="description" content="Космический тактический коллекционный idle-менеджер для Android: развивайте орбитальные сектора, собирайте адмиралов и космо-хомяков, штурмуйте боссов и играйте офлайн годами." />
    <meta property="og:title" content="Звёздный Король — Космическая Империя" />
    <meta property="og:description" content="Космический тактический коллекционный idle-менеджер для Android с офлайн-прогрессом и переносом сохранений." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0D14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Звёздный Король" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0B0D14] text-[#F4F1EA] antialiased selection:bg-[#E5A93C]/30 selection:text-[#F8D482]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        var devEntry = document.querySelector('script[src*="/src/main.tsx"]');
        if (!devEntry) return;
        setTimeout(function () {
          if (window.__ZK_MOUNTED__) return;
          fetch('/src/main.tsx', { method: 'HEAD' })
            .then(function (r) {
              var ct = (r.headers.get('content-type') || '').toLowerCase();
              if (r.ok && ct.indexOf('javascript') !== -1) return;
              return fetch('./docs/index.html', { method: 'HEAD' }).then(function (d) {
                if (d.ok) {
                  window.location.replace('./docs/' + window.location.search + window.location.hash);
                } else {
                  var root = document.getElementById('root');
                  if (root) {
                    root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;text-align:center"><div><h2 style="color:#E5A93C;margin-bottom:8px">Звёздный Король</h2><p style="color:#9AA3B5;font-size:14px;max-width:360px">Для запуска на GitHub Pages выберите источник <b>GitHub Actions</b> или ветку <b>main /docs</b> в настройках репозитория (Settings → Pages).</p></div></div>';
                  }
                }
              });
            })
            .catch(function () {});
        }, 700);
      });
    </script>
  </body>
</html>
